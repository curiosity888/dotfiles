[image]
command = "bash"
args = ["-c", '''
dir="$(dirname "$1")"
cd "$dir" || exit
files=()
while IFS= read -r f; do
  files+=("$f")
done < <(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.gif" -o -iname "*.webp" -o -iname "*.bmp" -o -iname "*.tiff" \) | sort)
imv "${files[@]}" --start-at "$(basename "$1")"
''', "bash", "$1"]
block = true
orphan = true

